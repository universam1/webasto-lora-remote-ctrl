; Host-side unit tests for the hardware independent core (lib/webasto_core, lib/rt).
; Separate project because the main platformio.ini sets an ESP32 board for every environment.
;   cd test/native_project && pio test -e native
; or from the repo root:  tools/run_native_tests.sh
[platformio]
test_dir = ..

[env:native]
platform = native
test_framework = unity
build_type = release
build_flags =
  -std=gnu++17
  -pthread
  -I../../lib/webasto_core
  -I../../lib/common
  -I../../lib/rt
  -I../../lib/heater
  -I../../src/receiver
lib_deps =
  webasto_core
