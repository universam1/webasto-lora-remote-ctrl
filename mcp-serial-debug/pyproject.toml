[project]
name = "webasto-serial-debug"
version = "0.2.0"
description = "MCP server for debugging the Webasto ESP32 boards over USB serial and BLE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pyserial>=3.5",
    "bleak>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
webasto-serial-debug = "webasto_serial_debug.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webasto_serial_debug"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ['py310']
